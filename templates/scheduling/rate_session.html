{% extends "base.html" %}
{% block content %}

<h2>Rate players for: {{ session.title }}</h2>

<form method="post">
  {% csrf_token %}

  {% for user, form in forms %}
    <fieldset style="margin-bottom:14px; padding:10px; border:1px solid #ccc;">
      <legend>{{ user.username }}</legend>
      {{ form.as_p }}
    </fieldset>
  {% endfor %}

  <button type="submit">Save ratings</button>
</form>

{% endblock %}
