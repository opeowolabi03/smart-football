{% load static %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Football</title>

  <link rel="stylesheet" href="{% static 'css/smartfootball.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="{% url 'session_list' %}">
      <span class="brand-mark">⚽</span>
      <span>Smart Football</span>
    </a>

    <nav class="site-nav">
      <a href="{% url 'session_list' %}">Home</a>

      {% if user.is_authenticated %}
        <a href="{% url 'edit_profile' %}">Profile</a>
        <a href="{% url 'organiser_dashboard' %}">Dashboard</a>

        <form class="logout-form" method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="nav-button" type="submit">Logout</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'signup' %}">Sign Up</a>
      {% endif %}
    </nav>
  </header>

  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    © 2026 Smart Football. All rights reserved.
  </footer>
</body>
</html>
